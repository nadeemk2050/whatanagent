<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta name="theme-color" content="#34373d">
<title>CRM · WhatAnAgent</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    :root { --ink:#34373d; --cream:#f7ecd6; --paper:#fffdf8; --line:#e3ded1; }
    * { -webkit-tap-highlight-color: transparent; }
    body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial; background:#f6f4ee; color:#1f2937; }
    .brand { font-weight:800; letter-spacing:-.02em; }
    .card { background:var(--paper); border:1px solid var(--line); border-radius:14px; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; border-radius:10px; font-weight:700; font-size:13px; padding:9px 14px; border:1px solid transparent; cursor:pointer; white-space:nowrap; }
    .btn-dark { background:var(--ink); color:var(--cream); }
    .btn-light { background:var(--paper); border-color:var(--line); color:#4b5563; }
    .btn-danger { background:#fff1f1; border-color:#fecaca; color:#b91c1c; }
    .inp { width:100%; padding:9px 11px; border:1px solid #d5cfc2; border-radius:10px; font-size:14px; background:#fff; outline:none; }
    label.fl { display:block; font-size:12px; font-weight:700; color:#6b7280; margin-bottom:4px; }
    .nav-item { display:flex; align-items:center; gap:10px; width:100%; padding:10px 12px; border-radius:10px; font-size:14px; font-weight:600; color:#4b5563; cursor:pointer; border:0; background:transparent; text-align:left; }
    .nav-item:hover { background:#f3ecdd; }
    .nav-item.active { background:var(--ink); color:var(--cream); }
    .chip { display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:700; background:#f3f4f6; color:#4b5563; }
    .pill-lead{background:#eef2ff;color:#4338ca}.pill-prospect{background:#e0f2fe;color:#0369a1}.pill-active{background:#dcfce7;color:#15803d}.pill-vip{background:#fef3c7;color:#b45309}.pill-inactive{background:#f3f4f6;color:#6b7280}
    .kpi { font-size:26px; font-weight:800; letter-spacing:-.02em; }
    .drawer { position:fixed; inset:0; z-index:50; display:none; }
    .drawer.open { display:block; }
    .drawer-panel { position:absolute; top:0; right:0; height:100%; width:100%; max-width:620px; background:var(--paper); box-shadow:-16px 0 40px rgba(0,0,0,.14); display:flex; flex-direction:column; }
    .modal { position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; padding:16px; background:rgba(0,0,0,.45); }
    .modal.open { display:flex; }
    .modal-box { background:var(--paper); border-radius:16px; width:100%; max-width:560px; max-height:92vh; display:flex; flex-direction:column; overflow:hidden; }
    .tl { position:relative; padding-left:22px; }
    .tl:before { content:''; position:absolute; left:7px; top:4px; bottom:4px; width:2px; background:#ece7db; }
    .tl-item { position:relative; padding-bottom:14px; }
    .tl-item:before { content:''; position:absolute; left:-19px; top:5px; width:9px; height:9px; border-radius:50%; background:#c9c2b0; border:2px solid var(--paper); }
    .tl-item.act-call:before{background:#0ea5e9}.tl-item.act-email:before{background:#8b5cf6}.tl-item.act-whatsapp:before{background:#22c55e}.tl-item.act-meeting:before{background:#f59e0b}.tl-item.act-deal:before{background:#ec4899}.tl-item.act-stage:before{background:#111827}.tl-item.act-system:before{background:#9ca3af}.tl-item.act-import:before{background:#14b8a6}
    .kan { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(250px,1fr); gap:12px; overflow-x:auto; padding-bottom:10px; align-items:start; }
    .kan-col { background:#f1efe8; border:1px solid var(--line); border-radius:14px; padding:8px; min-height:120px; }
    .kan-card { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:10px; margin-bottom:8px; cursor:grab; }
    .kan-card.drag { opacity:.45; }
    .kan-col.over { outline:2px dashed #a8a29e; outline-offset:-4px; }
    #auth { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:16px; background:radial-gradient(1200px 600px at 20% 0%, #fbf6ea 0%, #f6f4ee 60%); overflow:auto; }
    .tabs { display:flex; gap:6px; background:#f1efe8; padding:4px; border-radius:12px; }
    .tab { flex:1; padding:8px; border-radius:9px; font-size:13px; font-weight:700; color:#6b7280; border:0; background:transparent; cursor:pointer; }
    .tab.on { background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.08); }
    .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:24px; z-index:90; background:#111827; color:#fff; padding:10px 16px; border-radius:12px; font-size:13px; font-weight:600; display:none; }
    .toast.err { background:#b91c1c; }
    .toast.on { display:block; }
    .hide { display:none !important; }
    .md\:hide { display:inline-flex; }
    @media (min-width: 768px) { .md\:hide { display:none !important; } }
    @media (max-width: 820px) { .drawer-panel { max-width: none; } }
</style>
</head>
<body>

<div id="auth">
    <div class="w-full max-w-[440px]">
        <div class="text-center mb-5">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl text-sm font-extrabold mb-3" style="background:var(--ink);color:var(--cream)">CRM</div>
            <h1 class="text-2xl brand">WhatAnAgent CRM</h1>
            <p class="text-sm text-gray-500 mt-1">Customers, deals and every conversation in one place.</p>
        </div>
        <div class="card p-5">
            <div class="tabs mb-4">
                <button class="tab on" data-auth="signin">Sign in</button>
                <button class="tab" data-auth="signup">Create account</button>
            </div>
            <div id="pane-signin">
                <div class="tabs mb-3" style="background:#eceae2">
                    <button class="tab on" data-who="owner">Account owner</button>
                    <button class="tab" data-who="member">Team member</button>
                </div>
                <div id="signin-owner">
                    <label class="fl">Email</label>
                    <input id="si-email" class="inp mb-3" type="email" placeholder="you@company.com" autocomplete="username">
                </div>
                <div id="signin-member" class="hide">
                    <label class="fl">Company code</label>
                    <input id="si-code" class="inp mb-3 uppercase" placeholder="e.g. 7TR6F6" autocomplete="off">
                    <label class="fl">Your team name</label>
                    <input id="si-name" class="inp mb-3" placeholder="e.g. Ahmed Khan" autocomplete="username">
                </div>
                <label class="fl">Password</label>
                <input id="si-pass" class="inp mb-4" type="password" placeholder="Your password" autocomplete="current-password">
                <button id="si-go" class="btn btn-dark w-full">Sign in</button>
                <div id="si-msg" class="text-xs text-red-600 mt-3"></div>
                <div class="text-[11px] text-gray-400 mt-3">Team members sign in with the company code from the owner, their name and password.</div>
            </div>
            <div id="pane-signup" class="hide">
                <label class="fl">Company / team name</label>
                <input id="su-company" class="inp mb-3" placeholder="e.g. Gulf Traders LLC">
                <label class="fl">Your name (owner)</label>
                <input id="su-name" class="inp mb-3" placeholder="e.g. Nadeem">
                <label class="fl">Email</label>
                <input id="su-email" class="inp mb-3" type="email" placeholder="you@company.com" autocomplete="username">
                <label class="fl">Password (min 6)</label>
                <input id="su-pass" class="inp mb-4" type="password" placeholder="Choose a password" autocomplete="new-password">
                <button id="su-go" class="btn btn-dark w-full">Create my CRM</button>
                <div id="su-msg" class="text-xs text-red-600 mt-3"></div>
                <div class="text-[11px] text-gray-400 mt-3">Each account is completely separate: your company's data is never shared with another account.</div>
            </div>
        </div>
        <div class="text-center mt-4"><a href="/aligntasks/" class="text-xs text-gray-500 underline">← Back to AlignTasks</a></div>
    </div>
</div>

<div id="app" class="hide min-h-screen">
    <aside id="side" class="fixed left-0 top-0 bottom-0 w-[236px] bg-[#fffdf8] border-r hidden md:flex flex-col z-30" style="border-color:var(--line)">
        <div class="p-4 border-b" style="border-color:var(--line)">
            <div class="flex items-center gap-2">
                <div class="w-9 h-9 rounded-xl flex items-center justify-center font-extrabold" style="background:var(--ink);color:var(--cream);font-size:11px">CRM</div>
                <div class="min-w-0">
                    <div id="co-name" class="font-bold text-sm truncate"></div>
                    <div id="co-code" class="text-[11px] text-gray-500"></div>
                </div>
            </div>
        </div>
        <nav class="p-2 space-y-1 flex-1 overflow-y-auto" id="nav"></nav>
        <div class="p-3 border-t text-xs text-gray-500" style="border-color:var(--line)">
            <div id="me-name" class="font-bold text-gray-700"></div>
            <div id="me-role" class="mb-2"></div>
            <button id="logout" class="btn btn-light w-full" style="padding:6px">Sign out</button>
        </div>
    </aside>
    <div class="md:ml-[236px] min-h-screen flex flex-col">
        <header class="sticky top-0 z-20 bg-[#fffdf8]/95 border-b" style="border-color:var(--line)">
            <div class="px-3 sm:px-5 py-2.5 flex items-center gap-2">
                <button id="burger" class="btn btn-light md:hide" style="padding:7px 9px">☰</button>
                <div id="page-title" class="font-bold text-base truncate flex-1">Dashboard</div>
                <input id="global-search" class="inp hidden sm:block" style="max-width:240px" placeholder="Search customers…">
                <button id="qa-add" class="btn btn-dark">+ New</button>
            </div>
            <div id="mobile-nav" class="md:hide px-2 pb-2 overflow-x-auto whitespace-nowrap"></div>
        </header>
        <main id="main" class="flex-1 p-3 sm:p-5"></main>
    </div>
</div>

<div id="drawer" class="drawer">
    <div class="absolute inset-0 bg-black/40" data-close="drawer"></div>
    <div class="drawer-panel">
        <div class="p-4 border-b flex items-start gap-3" style="border-color:var(--line)">
            <div class="min-w-0 flex-1">
                <div id="dr-name" class="text-lg font-extrabold truncate"></div>
                <div id="dr-sub" class="text-xs text-gray-500 truncate"></div>
            </div>
            <button class="btn btn-light" data-close="drawer">✕</button>
        </div>
        <div id="dr-actions" class="px-4 py-2 flex gap-2 flex-wrap border-b" style="border-color:var(--line)"></div>
        <div class="px-4 pt-2"><div id="dr-tabs" class="tabs"></div></div>
        <div id="dr-body" class="p-4 overflow-y-auto flex-1"></div>
    </div>
</div>

<div id="modal" class="modal"><div class="modal-box">
    <div class="px-4 py-3 border-b flex items-center justify-between" style="border-color:var(--line)">
        <div id="md-title" class="font-bold"></div>
        <button class="btn btn-light" data-close="modal">✕</button>
    </div>
    <div id="md-body" class="p-4 overflow-y-auto" style="flex:1"></div>
    <div id="md-foot" class="px-4 py-3 border-t flex justify-end gap-2" style="border-color:var(--line)"></div>
</div></div>

<div id="toast" class="toast"></div>

<script>
(function () {
    'use strict';
    const API = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? 'http://localhost:4000/api/crm' : 'https://whatanagent.duckdns.org/api/crm';
    const $ = (s, r) => (r || document).querySelector(s);
    const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const money = (n, cur) => (cur || 'USD') + ' ' + (Number(n) || 0).toLocaleString(undefined, { maximumFractionDigits: 0 });
    const dt = (ms) => ms ? new Date(ms).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: '2-digit' }) : '';
    const ago = (ms) => {
        const m = Math.max(0, Math.round((Date.now() - ms) / 60000));
        if (m < 1) return 'just now';
        if (m < 60) return m + ' min ago';
        if (m < 1440) return Math.round(m / 60) + ' h ago';
        if (m < 43200) return Math.round(m / 1440) + ' d ago';
        return dt(ms);
    };
    const SV = (p) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px">' + p + '</svg>';
    const NAV = [
        { id: 'dashboard', label: 'Dashboard', icon: SV('<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>') },
        { id: 'contacts', label: 'Customers', icon: SV('<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>') },
        { id: 'pipeline', label: 'Deals & pipeline', icon: SV('<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>') },
        { id: 'tasks', label: 'Tasks', icon: SV('<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>') },
        { id: 'team', label: 'Team', icon: SV('<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 12 0v1"/>') },
        { id: 'settings', label: 'Settings', icon: SV('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a7.9 7.9 0 0 0 0-6l2-1.6-2-3.4-2.4 1a8 8 0 0 0-1.7-1L15 4h-4l-.3 2.6a8 8 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 9a7.9 7.9 0 0 0 0 6l-2 1.6 2 3.4 2.4-1a8 8 0 0 0 1.7 1L11 20h4l.3-2.6a8 8 0 0 0 1.7-1l2.4 1 2-3.4z"/>') }
    ];

    let S = {
        token: localStorage.getItem('crmToken') || '',
        member: null, company: null, view: 'dashboard',
        contacts: [], deals: [], tasks: [], team: [],
        drawer: null, drawerTab: 'timeline', searchQ: '', filterStatus: '', filterTag: ''
    };

    function toast(msg, isErr) {
        const t = $('#toast');
        t.textContent = msg;
        t.className = 'toast on' + (isErr ? ' err' : '');
        clearTimeout(t._t);
        t._t = setTimeout(() => { t.className = 'toast'; }, 3200);
    }
    async function api(path, opts) {
        opts = opts || {};
        const res = await fetch(API + path, {
            method: opts.method || 'GET',
            headers: Object.assign({ 'Content-Type': 'application/json' }, S.token ? { Authorization: 'Bearer ' + S.token } : {}),
            body: opts.body ? JSON.stringify(opts.body) : undefined
        });
        let j = null;
        try { j = await res.json(); } catch (e) { j = null; }
        if (res.status === 401) { signOut(true); throw new Error((j && j.error) || 'Please sign in again.'); }
        if (!res.ok || !j || j.ok === false) throw new Error((j && j.error) || 'Request failed (' + res.status + ')');
        return j;
    }
    const canManage = () => S.member && S.member.role === 'owner';
    const statusPill = (s) => '<span class="chip pill-' + esc(String(s || 'Lead').toLowerCase()) + '">' + esc(s || 'Lead') + '</span>';
    const memberName = (id) => { const m = S.team.find(x => x.id === id); return m ? m.name : ''; };
    function stageName(id) { const st = (S.company && S.company.stages) || []; const f = st.find(s => s.id === id); return f ? f.name : (id || ''); }

    function showAuth() { $('#auth').classList.remove('hide'); $('#app').classList.add('hide'); }
    function showApp() { $('#auth').classList.add('hide'); $('#app').classList.remove('hide'); }
    function signOut(silent) {
        localStorage.removeItem('crmToken');
        S.token = ''; S.member = null; S.company = null;
        showAuth();
        if (!silent) toast('Signed out');
    }
    $$('[data-auth]').forEach(b => b.onclick = () => {
        $$('[data-auth]').forEach(x => x.classList.toggle('on', x === b));
        $('#pane-signin').classList.toggle('hide', b.dataset.auth !== 'signin');
        $('#pane-signup').classList.toggle('hide', b.dataset.auth !== 'signup');
    });
    $$('[data-who]').forEach(b => b.onclick = () => {
        $$('[data-who]').forEach(x => x.classList.toggle('on', x === b));
        $('#signin-owner').classList.toggle('hide', b.dataset.who !== 'owner');
        $('#signin-member').classList.toggle('hide', b.dataset.who !== 'member');
    });
    async function doLogin() {
        const email = $('#si-email').value.trim();
        const code = $('#si-code').value.trim().toUpperCase();
        const name = $('#si-name').value.trim();
        const pass = $('#si-pass').value;
        const msg = $('#si-msg');
        msg.textContent = '';
        if (!pass || (!email && !(code && name))) { msg.textContent = 'Fill in the fields above.'; return; }
        try { finishAuth(await api('/login', { method: 'POST', body: email ? { email, password: pass } : { code, name, password: pass } })); }
        catch (e) { msg.textContent = e.message; }
    }
    async function doSignup() {
        const msg = $('#su-msg');
        msg.textContent = '';
        const body = { company: $('#su-company').value.trim(), name: $('#su-name').value.trim(), email: $('#su-email').value.trim(), password: $('#su-pass').value };
        if (!body.name || !body.email || !body.password) { msg.textContent = 'Company name, your name, email and password are needed.'; return; }
        try { finishAuth(await api('/register', { method: 'POST', body })); }
        catch (e) { msg.textContent = e.message; }
    }
    function finishAuth(d) {
        S.token = d.token; S.member = d.member; S.company = d.company;
        localStorage.setItem('crmToken', d.token);
        boot();
    }
    $('#si-go').onclick = doLogin;
    $('#si-pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
    $('#su-go').onclick = doSignup;

    function closeSide() {
        const s = $('#side');
        if (window.innerWidth < 768) { s.classList.add('hidden'); s.classList.remove('flex'); }
    }
    function paintNav() {
        $('#nav').innerHTML = NAV.map(n => '<button class="nav-item' + (S.view === n.id ? ' active' : '') + '" data-nav="' + n.id + '">' + n.icon + '<span>' + n.label + '</span></button>').join('');
        $$('#nav [data-nav]').forEach(b => b.onclick = () => { go(b.dataset.nav); closeSide(); });
        $('#mobile-nav').innerHTML = NAV.map(n => '<button class="btn ' + (S.view === n.id ? 'btn-dark' : 'btn-light') + ' mr-1" style="padding:6px 10px" data-nav="' + n.id + '">' + n.label + '</button>').join('');
        $$('#mobile-nav [data-nav]').forEach(b => b.onclick = () => go(b.dataset.nav));
        const cur = NAV.find(n => n.id === S.view);
        $('#page-title').textContent = cur ? cur.label : '';
        $('#co-name').textContent = S.company ? S.company.name : '';
        $('#co-code').innerHTML = S.company ? 'Code <b>' + esc(S.company.code) + '</b>' + (S.company.linked ? ' · <span style="color:#15803d">linked</span>' : '') : '';
        $('#me-name').textContent = S.member ? S.member.name : '';
        $('#me-role').textContent = S.member ? (S.member.role === 'owner' ? 'Account owner' : 'Team member') : '';
    }
    function go(view) { S.view = view; paintNav(); render(); }
    $('#logout').onclick = () => signOut();
    $('#burger').onclick = () => { const s = $('#side'); s.classList.toggle('hidden'); s.classList.toggle('flex'); };
    $('#qa-add').onclick = () => {
        if (S.view === 'pipeline') return dealForm(null);
        if (S.view === 'tasks') return taskForm();
        if (S.view === 'team') return canManage() ? memberForm() : toast('Only the owner can add team members', true);
        return contactForm(null);
    };
    $('#global-search').addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        S.searchQ = e.target.value.trim();
        if (S.searchQ) S.view = 'contacts';
        paintNav(); render();
    });
    $$('[data-close]').forEach(b => b.onclick = () => {
        if (b.dataset.close === 'drawer') { $('#drawer').classList.remove('open'); S.drawer = null; }
        else $('#modal').classList.remove('open');
    });
    function openModal(title, bodyHtml, footHtml) {
        $('#md-title').textContent = title;
        $('#md-body').innerHTML = bodyHtml;
        $('#md-foot').innerHTML = footHtml || '';
        $('#modal').classList.add('open');
    }
    const closeModal = () => $('#modal').classList.remove('open');

    async function loadAll() {
        const [c, d, t, tm] = await Promise.all([api('/contacts'), api('/deals'), api('/tasks'), api('/team')]);
        S.contacts = c.contacts; S.deals = d.deals; S.tasks = t.tasks; S.team = tm.members;
    }
    async function boot() {
        try {
            const me = await api('/me');
            S.member = me.member; S.company = me.company;
            showApp(); paintNav(); await render();
        } catch (e) { showAuth(); }
    }

    async function render() {
        const main = $('#main');
        main.innerHTML = '<div class="text-sm text-gray-400 p-6">Loading…</div>';
        try {
            await loadAll();
            if (S.view === 'dashboard') await renderDashboard(main);
            else if (S.view === 'contacts') renderContacts(main);
            else if (S.view === 'pipeline') renderPipeline(main);
            else if (S.view === 'tasks') renderTasks(main);
            else if (S.view === 'team') renderTeam(main);
            else if (S.view === 'settings') renderSettings(main);
        } catch (e) {
            main.innerHTML = '<div class="card p-4 text-sm text-red-600">' + esc(e.message) + '</div>';
        }
    }

    function tlItem(a) {
        const icon = { call: '📞', email: '✉️', whatsapp: '💬', meeting: '📅', note: '📝', deal: '💼', stage: '➡️', system: '⚙️', import: '📥', update: '✏️', task: '✅', message: '💬' }[a.type] || '•';
        return '<div class="tl-item act-' + esc(a.type) + '"><div class="text-sm">' + icon + ' ' + esc(a.body) + '</div>'
            + '<div class="text-[11px] text-gray-400">' + esc(a.memberName || '') + ' · ' + ago(a.at)
            + (a.contactId ? ' · <button class="underline" data-open-contact="' + esc(a.contactId) + '">open customer</button>' : '') + '</div></div>';
    }

    async function openContact(id) {
        const d = await api('/contacts/' + id);
        S.drawer = d; S.drawerTab = 'timeline';
        const c = d.contact;
        $('#dr-name').textContent = c.name || c.company;
        $('#dr-sub').textContent = [c.company, c.title, (c.emails || [])[0], (c.phones || [])[0], c.country].filter(Boolean).join(' · ');

            '<button class="btn btn-dark" id="d-log">+ Log activity</button><button class="btn btn-light" id="d-deal">+ Deal</button>'

            + ((canManage() || c.ownerId === S.member.id || c.createdBy === S.member.id) ? '<button class="btn btn-danger" id="d-del">Delete</button>' : '');

        $('#d-deal').onclick = () => dealForm(null, c.id);

                try { await api('/tasks/' + cb.dataset.tid, { method: 'PATCH', body: { done: cb.checked } }); openContact(c.id); } catch (e) { toast(e.message, true); }

        } else {
            const kv = [['Company', c.company], ['Title', c.title], ['Emails', (c.emails || []).join(', ')], ['Phones', (c.phones || []).join(', ')], ['Website', c.website], ['Country', c.country], ['City', c.city], ['Address', c.address], ['Status', c.status], ['Owner', memberName(c.ownerId)], ['Source', c.source], ['Created', dt(c.createdAt)], ['Created by', c.createdByName]];
            body.innerHTML = '<div class="grid grid-cols-2 gap-2">' + kv.map(x => '<div class="bg-white rounded-lg p-2 border" style="border-color:var(--line)"><div class="text-[10px] uppercase font-bold text-gray-400">' + x[0] + '</div><div class="text-sm break-words">' + esc(x[1] || '—') + '</div></div>').join('') + '</div>'
                + (Object.values(c.socials || {}).some(Boolean) ? '<div class="mt-3 flex gap-2 flex-wrap">' + Object.entries(c.socials).map(([k, v]) => v ? '<a class="chip" target="_blank" rel="noopener" href="' + esc(v) + '">' + esc(k) + '</a>' : '').join('') + '</div>' : '')
                + (c.notes ? '<div class="mt-3 card p-3 text-sm whitespace-pre-wrap">' + esc(c.notes) + '</div>' : '')
                + (c.aiProfile ? '<div class="mt-3 card p-3"><div class="text-[11px] font-bold uppercase mb-1" style="color:#4338ca">AI research · ' + esc(c.aiProfile.confidence || '') + '</div><div class="text-sm">' + esc(c.aiProfile.summary || '') + '</div>'
                    + (c.aiProfile.sector ? '<div class="text-xs text-gray-500 mt-1">Sector: ' + esc(c.aiProfile.sector) + (c.aiProfile.size ? ' · Size: ' + esc(c.aiProfile.size) : '') + '</div>' : '')
                    + ((c.aiProfile.opportunities || []).length ? '<div class="text-xs mt-2"><b>Opportunities:</b><ul class="list-disc pl-4">' + c.aiProfile.opportunities.map(o => '<li>' + esc(o) + '</li>').join('') + '</ul></div>' : '') + '</div>' : '');

    function csvImport() {
        openModal('Import customers from CSV',
            '<div class="text-sm text-gray-600 mb-3">First row must be the header. Recognised columns: <b>name, company, email, phone, country, city, address, title, tags, status, value, notes</b>. Duplicates (same email or phone) are merged, never doubled.</div>'
            + '<input type="file" id="csv-file" accept=".csv,text/csv" class="inp mb-3">'
            + '<label class="fl">…or paste the rows here</label><textarea id="csv-text" class="inp" rows="6" placeholder="Name,Company,Email,Phone"></textarea>'

            '<button class="btn btn-light" data-close="modal">Cancel</button><button class="btn btn-dark" id="csv-go">Import</button>');
        $('#csv-file').onchange = (e) => {
            const f = e.target.files[0];
            if (!f) return;
            const r = new FileReader();
            r.onload = () => { $('#csv-text').value = String(r.result || ''); };
            r.readAsText(f);
        };
        $('#csv-go').onclick = async () => {
            const csv = $('#csv-text').value;
            if (!csv.trim()) return toast('Choose a file or paste rows', true);
            $('#csv-msg').textContent = 'Importing…';
            try {
                const r = await api('/import/csv', { method: 'POST', body: { csv } });
                toast(r.added + ' added, ' + r.merged + ' merged');
                closeModal(); await render();
            } catch (e) { $('#csv-msg').textContent = e.message; }
        };
    }

            }).join('') + '</div>';
        $('#p-new').onclick = () => dealForm(null);
        $$('[data-deal]').forEach(card => {
            card.onclick = () => { const d = S.deals.find(x => x.id === card.dataset.deal); if (d) dealForm(d); };
            card.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', card.dataset.deal); card.classList.add('drag'); });
            card.addEventListener('dragend', () => card.classList.remove('drag'));
        });
        $$('.kan-col').forEach(col => {
            col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('over'); });
            col.addEventListener('dragleave', () => col.classList.remove('over'));
            col.addEventListener('drop', async (e) => {
                e.preventDefault(); col.classList.remove('over');
                const id = e.dataTransfer.getData('text/plain');
                const d = S.deals.find(x => x.id === id);
                if (!d || d.stage === col.dataset.stage) return;
                try { await api('/deals/' + id, { method: 'PATCH', body: { stage: col.dataset.stage } }); toast('Moved to ' + stageName(col.dataset.stage)); await render(); }
                catch (err) { toast(err.message, true); }
            });
        });
    }
    function dealForm(d, contactId) {
        const v = d || {};
        const stages = (S.company && S.company.stages) || [];
        const cid = v.contactId || contactId || '';
        openModal(d ? 'Edit deal' : 'New deal',
            '<div class="grid grid-cols-2 gap-3">'
            + '<div style="grid-column:span 2"><label class="fl">Deal title</label><input id="df-title" class="inp" value="' + esc(v.title || '') + '" placeholder="40ft container of textiles"></div>'
            + '<div><label class="fl">Customer</label><select id="df-contact" class="inp"><option value="">— none —</option>' + S.contacts.map(c => '<option value="' + esc(c.id) + '"' + (cid === c.id ? ' selected' : '') + '>' + esc(c.name || c.company) + '</option>').join('') + '</select></div>'
            + '<div><label class="fl">Value (' + esc(S.company.currency) + ')</label><input id="df-value" class="inp" type="number" value="' + esc(v.value || '') + '"></div>'
            + '<div><label class="fl">Stage</label><select id="df-stage" class="inp">' + stages.map(s => '<option value="' + esc(s.id) + '"' + (v.stage === s.id ? ' selected' : '') + '>' + esc(s.name) + '</option>').join('') + '</select></div>'
            + '<div><label class="fl">Probability %</label><input id="df-prob" class="inp" type="number" min="0" max="100" value="' + esc(v.probability != null ? v.probability : '') + '"></div>'
            + '<div><label class="fl">Expected close</label><input id="df-date" class="inp" type="date" value="' + esc(v.expectedCloseDate || '') + '"></div>'
            + '<div><label class="fl">Owner</label><select id="df-owner" class="inp"><option value="">—</option>' + S.team.map(m => '<option value="' + esc(m.id) + '"' + (v.ownerId === m.id ? ' selected' : '') + '>' + esc(m.name) + '</option>').join('') + '</select></div>'
            + '<div style="grid-column:span 2"><label class="fl">Notes</label><textarea id="df-notes" class="inp" rows="2">' + esc(v.notes || '') + '</textarea></div></div>',
            (d ? '<button class="btn btn-danger" id="df-del" style="margin-right:auto">Delete</button>' : '') + '<button class="btn btn-light" data-close="modal">Cancel</button><button class="btn btn-dark" id="df-save">' + (d ? 'Save' : 'Create deal') + '</button>');
        $('#df-save').onclick = async () => {
            const body = { title: $('#df-title').value.trim(), contactId: $('#df-contact').value, value: $('#df-value').value, stage: $('#df-stage').value, probability: $('#df-prob').value, expectedCloseDate: $('#df-date').value, ownerId: $('#df-owner').value, notes: $('#df-notes').value };
            if (!body.title) return toast('Give the deal a title', true);
            try {
                if (d) await api('/deals/' + d.id, { method: 'PATCH', body }); else await api('/deals', { method: 'POST', body });
                closeModal(); toast(d ? 'Deal saved' : 'Deal created'); await render();
                if (S.drawer) openContact(S.drawer.contact.id);
            } catch (e) { toast(e.message, true); }
        };
        if ($('#df-del')) $('#df-del').onclick = async () => {
            if (!confirm('Delete this deal?')) return;
            try { await api('/deals/' + d.id, { method: 'DELETE' }); closeModal(); toast('Deal deleted'); await render(); }
            catch (e) { toast(e.message, true); }
        };
    }

    function renderTasks(main) {
        const today = new Date().toISOString().slice(0, 10);
        const open = S.tasks.filter(t => !t.done), done = S.tasks.filter(t => t.done);
        const row = (t) => '<div class="card p-3 flex items-center gap-3"><input type="checkbox" ' + (t.done ? 'checked' : '') + ' data-task="' + esc(t.id) + '">'
            + '<div class="flex-1 min-w-0"><div class="text-sm font-semibold ' + (t.done ? 'line-through text-gray-400' : '') + '">' + esc(t.title) + '</div>'
            + '<div class="text-[11px] text-gray-500">' + esc([t.dueDate ? 'due ' + t.dueDate : '', memberName(t.assignedTo), t.contactId ? ((S.contacts.find(c => c.id === t.contactId) || {}).name || '') : ''].filter(Boolean).join(' · ')) + '</div></div>'
            + '<span class="chip" style="' + (t.priority === 'High' ? 'background:#fee2e2;color:#b91c1c' : t.priority === 'Low' ? 'background:#f3f4f6' : 'background:#fef3c7;color:#b45309') + '">' + esc(t.priority) + '</span>'
            + (t.dueDate && !t.done && t.dueDate < today ? '<span class="chip" style="background:#fee2e2;color:#b91c1c">overdue</span>' : '')
            + '<button class="btn btn-light" data-del-task="' + esc(t.id) + '" style="padding:4px 8px">✕</button></div>';
        main.innerHTML = '<div class="flex items-center gap-2 mb-3"><div class="text-sm text-gray-600">' + open.length + ' open · ' + done.length + ' done</div><div class="flex-1"></div><button class="btn btn-dark" id="t-new">+ New task</button></div>'
            + '<div class="grid gap-2">' + (S.tasks.length ? S.tasks.map(row).join('') : '<div class="card p-8 text-center text-sm text-gray-500">No tasks yet.</div>') + '</div>';
        $('#t-new').onclick = () => taskForm();
        $$('[data-task]').forEach(cb => cb.onchange = async () => {
            try { await api('/tasks/' + cb.dataset.task, { method: 'PATCH', body: { done: cb.checked } }); render(); } catch (e) { toast(e.message, true); }
        });
        $$('[data-del-task]').forEach(b => b.onclick = async () => {
            try { await api('/tasks/' + b.dataset.delTask, { method: 'DELETE' }); render(); } catch (e) { toast(e.message, true); }
        });
    }
    function taskForm(contactId) {
        openModal('New task',
            '<label class="fl">Task</label><input id="tf-title" class="inp mb-3" placeholder="Send the FOB quotation">'
            + '<div class="grid grid-cols-2 gap-3"><div><label class="fl">Due date</label><input id="tf-date" class="inp" type="date"></div>'
            + '<div><label class="fl">Priority</label><select id="tf-pri" class="inp"><option>High</option><option selected>Medium</option><option>Low</option></select></div>'
            + '<div><label class="fl">Customer</label><select id="tf-contact" class="inp"><option value="">—</option>' + S.contacts.map(c => '<option value="' + esc(c.id) + '"' + (contactId === c.id ? ' selected' : '') + '>' + esc(c.name || c.company) + '</option>').join('') + '</select></div>'
            + '<div><label class="fl">Assign to</label><select id="tf-assign" class="inp">' + S.team.map(m => '<option value="' + esc(m.id) + '"' + (S.member.id === m.id ? ' selected' : '') + '>' + esc(m.name) + '</option>').join('') + '</select></div></div>',
            '<button class="btn btn-light" data-close="modal">Cancel</button><button class="btn btn-dark" id="tf-save">Create</button>');
        $('#tf-save').onclick = async () => {
            const body = { title: $('#tf-title').value.trim(), dueDate: $('#tf-date').value, priority: $('#tf-pri').value, contactId: $('#tf-contact').value, assignedTo: $('#tf-assign').value };
            if (!body.title) return toast('Give the task a title', true);
            try {
                await api('/tasks', { method: 'POST', body }); closeModal(); toast('Task created');
                if (S.drawer) openContact(S.drawer.contact.id); else render();
            } catch (e) { toast(e.message, true); }
        };
    }

    function renderTeam(main) {
        main.innerHTML = '<div class="flex flex-wrap items-center gap-2 mb-3"><div class="card px-3 py-2 text-sm">Company code for member sign-in: <b class="tracking-widest">' + esc(S.company.code) + '</b> <button class="btn btn-light ml-2" id="copy-code" style="padding:4px 8px">Copy</button></div><div class="flex-1"></div>'
            + (canManage() ? '<button class="btn btn-dark" id="tm-new">+ Add team member</button>' : '') + '</div>'
            + '<div class="grid gap-2">' + S.team.map(m => '<div class="card p-3 flex items-center gap-3">'
                + '<div class="w-9 h-9 rounded-full flex items-center justify-center font-bold" style="background:#f3ecdd;color:#6b5f45;flex:0 0 auto">' + esc(m.name.slice(0, 1).toUpperCase()) + '</div>'
                + '<div class="flex-1 min-w-0"><div class="font-bold text-sm">' + esc(m.name) + ' ' + (m.role === 'owner' ? '<span class="chip" style="background:#eef2ff;color:#4338ca">owner</span>' : (m.active === false ? '<span class="chip">off</span>' : '')) + '</div>'
                + '<div class="text-[11px] text-gray-500">' + esc(m.email || 'signs in with code + name') + ' · ' + (m.lastLoginAt ? 'last login ' + ago(m.lastLoginAt) : 'never signed in') + '</div></div>'
                + (canManage() && m.role !== 'owner' ? '<div class="flex gap-1 flex-wrap"><button class="btn btn-light" data-reset="' + esc(m.id) + '">Reset password</button><button class="btn btn-light" data-toggle="' + esc(m.id) + '">' + (m.active === false ? 'Enable' : 'Disable') + '</button><button class="btn btn-danger" data-rm="' + esc(m.id) + '">Remove</button></div>' : '')
                + '</div>').join('') + '</div>'
            + '<div class="text-[11px] text-gray-400 mt-3">This team is only for the CRM. It is separate from the AlignTasks team, so nobody gains access to the other app through it.</div>';
        if ($('#copy-code')) $('#copy-code').onclick = () => { try { navigator.clipboard.writeText(S.company.code); toast('Code copied'); } catch (e) { toast(S.company.code); } };
        if ($('#tm-new')) $('#tm-new').onclick = () => memberForm();
        $$('[data-reset]').forEach(b => b.onclick = () => {
            const m = S.team.find(x => x.id === b.dataset.reset);
            openModal('Reset password for ' + m.name, '<label class="fl">New password</label><input id="rp-pass" class="inp" placeholder="min 6 characters">',
                '<button class="btn btn-light" data-close="modal">Cancel</button><button class="btn btn-dark" id="rp-go">Save</button>');
            $('#rp-go').onclick = async () => {
                try { await api('/team/' + m.id, { method: 'PATCH', body: { password: $('#rp-pass').value } }); closeModal(); toast('Password reset'); }
                catch (e) { toast(e.message, true); }
            };
        });
        $$('[data-toggle]').forEach(b => b.onclick = async () => {
            const m = S.team.find(x => x.id === b.dataset.toggle);
            try { await api('/team/' + m.id, { method: 'PATCH', body: { active: m.active === false } }); await render(); }
            catch (e) { toast(e.message, true); }
        });
        $$('[data-rm]').forEach(b => b.onclick = async () => {
            if (!confirm('Remove this team member? Their records stay.')) return;
            try { await api('/team/' + b.dataset.rm, { method: 'DELETE' }); await render(); } catch (e) { toast(e.message, true); }
        });
    }
    function memberForm() {
        openModal('Add team member',
            '<div class="text-sm text-gray-600 mb-3">They sign in on this CRM page with the company code <b>' + esc(S.company.code) + '</b>, their name and this password.</div>'
            + '<label class="fl">Name</label><input id="mf-name" class="inp mb-3" placeholder="Ahmed Khan">'
            + '<label class="fl">Email (optional)</label><input id="mf-email" class="inp mb-3" placeholder="ahmed@company.com">'
            + '<label class="fl">Password (min 6)</label><input id="mf-pass" class="inp" placeholder="Choose a password">',
            '<button class="btn btn-light" data-close="modal">Cancel</button><button class="btn btn-dark" id="mf-go">Add member</button>');
        $('#mf-go').onclick = async () => {
            try {
                await api('/team', { method: 'POST', body: { name: $('#mf-name').value.trim(), email: $('#mf-email').value.trim(), password: $('#mf-pass').value } });
                closeModal(); toast('Team member added'); await render();
            } catch (e) { toast(e.message, true); }
        };
    }

    function renderSettings(main) {
        const st = S.company.stages || [];
        main.innerHTML = '<div class="grid lg:grid-cols-2 gap-3">'
            + '<div class="card p-4"><div class="font-bold mb-3">Company</div><label class="fl">Name</label><input id="se-name" class="inp mb-3" value="' + esc(S.company.name) + '">'
            + '<label class="fl">Currency</label><input id="se-cur" class="inp mb-3" value="' + esc(S.company.currency) + '"><button class="btn btn-dark" id="se-save">Save</button></div>'
            + '<div class="card p-4"><div class="font-bold mb-1">Pipeline stages</div><div class="text-xs text-gray-500 mb-3">Rename, add or remove stages. Percentages drive the deal probability.</div>'
            + '<div id="st-list" class="space-y-2"></div><button class="btn btn-light mt-2" id="st-add">+ Add stage</button><button class="btn btn-dark mt-2 ml-2" id="st-save">Save stages</button></div>'
            + '<div class="card p-4"><div class="font-bold mb-1">Custom fields</div><div class="text-xs text-gray-500 mb-3">Extra fields for your customer records.</div>'
            + '<div id="cf-list" class="space-y-2"></div><button class="btn btn-light mt-2" id="cf-add">+ Add field</button><button class="btn btn-dark mt-2 ml-2" id="cf-save">Save fields</button></div>'
            + '<div class="card p-4"><div class="font-bold mb-1">WhatsApp capture</div><div class="text-xs text-gray-500 mb-3">Pull the contacts from your linked WhatsApp number into this CRM. Numbers already known are merged, never doubled.</div>'
            + '<label class="fl">WhatsApp account id (optional)</label><input id="se-wa" class="inp mb-3" placeholder="default: your login email">'
            + '<button class="btn btn-dark" id="wa-go">Capture WhatsApp contacts</button><div id="wa-msg" class="text-xs mt-2"></div></div></div>';
        $('#se-save').onclick = async () => {
            try { const r = await api('/settings', { method: 'PATCH', body: { name: $('#se-name').value, currency: $('#se-cur').value } }); S.company = r.company; paintNav(); toast('Saved'); }
            catch (e) { toast(e.message, true); }
        };
        let stages = st.map(s => Object.assign({}, s));
        const paintStages = () => {
            $('#st-list').innerHTML = stages.map((s, i) => '<div class="flex gap-2 items-center"><input class="inp st-name" value="' + esc(s.name) + '"><input class="inp st-prob" type="number" style="max-width:90px" value="' + esc(s.probability) + '"><button class="btn btn-light st-del" data-i="' + i + '">✕</button></div>').join('');
            $$('.st-del').forEach(b => b.onclick = () => { stages.splice(Number(b.dataset.i), 1); paintStages(); });
        };
        paintStages();
        $('#st-add').onclick = () => { stages.push({ id: 'st' + Date.now().toString(36), name: 'New stage', probability: 50 }); paintStages(); };
        $('#st-save').onclick = async () => {
            const rows = $$('#st-list > div');
            const out = rows.map((r, i) => ({ id: (stages[i] && stages[i].id) || 'st' + i, name: $('.st-name', r).value, probability: $('.st-prob', r).value }));
            try { const r = await api('/settings', { method: 'PATCH', body: { stages: out } }); S.company = r.company; paintNav(); toast('Stages saved'); render(); }
            catch (e) { toast(e.message, true); }
        };
        let fields = (S.company.customFields || []).map(f => Object.assign({}, f));
        const paintFields = () => {
            $('#cf-list').innerHTML = fields.map((f, i) => '<div class="flex gap-2 items-center"><input class="inp cf-name" value="' + esc(f.name) + '"><select class="inp cf-type" style="max-width:120px">' + ['text', 'number', 'select', 'date'].map(t => '<option' + (f.type === t ? ' selected' : '') + '>' + t + '</option>').join('') + '</select><button class="btn btn-light cf-del" data-i="' + i + '">✕</button></div>').join('');
            $$('.cf-del').forEach(b => b.onclick = () => { fields.splice(Number(b.dataset.i), 1); paintFields(); });
        };
        paintFields();
        $('#cf-add').onclick = () => { fields.push({ name: 'New field', type: 'text', target: 'contact' }); paintFields(); };
        $('#cf-save').onclick = async () => {
            const rows = $$('#cf-list > div');
            const out = rows.map(r => ({ name: $('.cf-name', r).value, type: $('.cf-type', r).value, target: 'contact' }));
            try { const r = await api('/settings', { method: 'PATCH', body: { customFields: out } }); S.company = r.company; toast('Fields saved'); render(); }
            catch (e) { toast(e.message, true); }
        };
        $('#wa-go').onclick = async () => {
            const msg = $('#wa-msg');
            msg.className = 'text-xs mt-2 text-gray-500';
            msg.textContent = 'Asking WhatsApp for the contacts…';
            try {
                const r = await api('/capture/whatsapp', { method: 'POST', body: { account: $('#se-wa').value.trim() } });
                msg.className = 'text-xs mt-2 text-green-700';
                msg.textContent = r.added + ' new contacts added, ' + r.merged + ' already known (scanned ' + r.scanned + ').';
            } catch (e) { msg.className = 'text-xs mt-2 text-red-600'; msg.textContent = e.message; }
        };
    }

    if (S.token) boot(); else { showAuth(); }
    window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { closeModal(); $('#drawer').classList.remove('open'); S.drawer = null; }
        if (e.key === 'k' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $('#global-search').focus(); }
    });
})();
</script>
</body>
</html>
