<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reminder Plans — WhatAnAgent</title>
<style>
  :root { --bg:#0f1216; --card:#171c22; --line:#2a323c; --txt:#e7edf3; --mut:#93a1b0; --acc:#3ea6ff; --ok:#2fbf71; --warn:#e6a23c; --bad:#e55353; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .wrap { max-width:1080px; margin:0 auto; padding:22px 16px 60px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--mut); font-size:13px; margin-bottom:18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .row > * { flex:1 1 180px; }
  label { display:block; font-size:12px; color:var(--mut); margin:8px 0 4px; }
  input, select, textarea { width:100%; background:#0c1015; color:var(--txt); border:1px solid var(--line); border-radius:9px; padding:9px 10px; font:inherit; }
  input[type=checkbox] { width:auto; }
  button { background:var(--acc); color:#04121f; border:0; border-radius:9px; padding:10px 14px; font-weight:600; cursor:pointer; }
  button.ghost { background:#222b35; color:var(--txt); }
  button.bad { background:#3a2024; color:#ffb4b4; }
  button.sm { padding:6px 10px; font-size:12px; }
  .chip { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; border:1px solid var(--line); }
  .st-scheduled { color:#9fd0ff; } .st-awaiting_reply { color:#ffd27a; } .st-snoozed { color:#c7a6ff; }
  .st-done { color:#8ee6b4; } .st-escalated { color:#ff9b9b; } .st-stopped { color:#aab6c2; }
  .plan { border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; background:#12171d; }
  .plan h3 { margin:0 0 4px; font-size:15px; }
  .muted { color:var(--mut); font-size:12px; }
  .banner { display:none; padding:10px 12px; border-radius:9px; margin-bottom:12px; }
  .banner.err { display:block; background:#3a2024; color:#ffc9c9; }
  .banner.ok { display:block; background:#143125; color:#a9f0c9; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .token { max-width:420px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>⏰ Reminder Plans</h1>
  <div class="sub">The AI sends the first message, reads every reply, changes its words, snoozes to “after Dhuhr / in 1 hour”, stops on request, and alerts the owner when someone stays silent.</div>

  <div id="banner" class="banner"></div>

  <div class="card">
    <label for="token">Admin token (x-admin-token)</label>
    <div class="row">
      <input id="token" class="token" type="password" placeholder="Paste the ADMIN_TOKEN from the server .env" autocomplete="off">
      <button id="saveToken" class="ghost">Save token</button>
    </div>
  </div>

  <div class="card">
    <h3 style="margin:0 0 6px">New reminder</h3>
    <div class="row">
      <div><label>Contact name</label><input id="contactName" placeholder="Sister"></div>
      <div><label>WhatsApp number (with country code)</label><input id="phone" placeholder="923001234567"></div>
      <div><label>Type</label>
        <select id="goalType">
          <option value="medicine">Medicine</option>
          <option value="walk">Morning walk</option>
          <option value="custom">Custom</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div style="flex:2 1 320px"><label>Goal</label><input id="goal" placeholder="Take medicine"></div>
      <div><label>First send (local time)</label><input id="timeLocal" type="time" value="10:00"></div>
      <div><label>Timezone</label><input id="timezone" value="Asia/Karachi"></div>
    </div>
    <div class="row">
      <div><label>Max attempts</label><input id="maxAttempts" type="number" value="5" min="1" max="12"></div>
      <div><label>Alert owner after</label><input id="escalateAfterAttempts" type="number" value="4" min="1" max="12"></div>
      <div><label>Quiet hours start</label><input id="quietStart" type="time" value="22:30"></div>
      <div><label>Quiet hours end</label><input id="quietEnd" type="time" value="06:30"></div>
    </div>
    <label><input id="repeatDaily" type="checkbox"> Repeat every day</label>
    <div class="actions">
      <button id="create">Create reminder</button>
    </div>
  </div>

  <div class="card">
    <div class="row" style="align-items:center">
      <h3 style="margin:0;flex:1">Plans</h3>
      <button id="refresh" class="ghost sm" style="flex:0 0 auto">Refresh</button>
    </div>
    <div id="list" style="margin-top:12px"></div>
  </div>
</div>

<script>
  const $ = (s) => document.querySelector(s);
  const tokenKey = 'wa_admin_token';
  let token = localStorage.getItem(tokenKey) || '';
  let timer = null;

  function banner(text, ok) {
    const b = $('#banner');
    b.className = 'banner ' + (ok ? 'ok' : 'err');
    b.textContent = text;
  }

  async function api(path, opts = {}) {
    const res = await fetch(path, {
      ...opts,
      headers: { 'Content-Type': 'application/json', 'x-admin-token': token, ...(opts.headers || {}) }
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.error || ('HTTP ' + res.status));
    return j;
  }

  function fmt(ms, tz) {
    if (!ms) return '—';
    try {
      return new Intl.DateTimeFormat('en-GB', {
        timeZone: tz || 'Asia/Karachi', weekday: 'short', day: '2-digit', month: 'short',
        hour: '2-digit', minute: '2-digit', hour12: false
      }).format(new Date(ms));
    } catch (e) { return new Date(ms).toLocaleString(); }
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function render(plans) {
    const list = $('#list');
    if (!plans.length) { list.innerHTML = '<div class="muted">No plans yet.</div>'; return; }
    list.innerHTML = plans.map((p) => {
      const last = (p.lastMessages || []).slice(-1)[0];
      return '<div class="plan">' +
        '<h3>' + esc(p.contactName || p.phone || p.contactJid) + ' — ' + esc(p.goal) + '</h3>' +
        '<div class="muted">' +
          '<span class="chip st-' + esc(p.status) + '">' + esc(p.status) + '</span> · ' +
          'attempts ' + (p.attempts || 0) + '/' + (p.maxAttempts || 5) + ' · ' +
          'next ' + fmt(p.nextWakeupAt, p.timezone) + ' (' + esc(p.timezone || '') + ')' +
          (p.repeatDaily ? ' · daily' : '') +
        '</div>' +
        (p.contextNote ? '<div class="muted" style="margin-top:6px">note: ' + esc(p.contextNote) + '</div>' : '') +
        (last ? '<div class="muted" style="margin-top:6px">last sent: “' + esc(last.text) + '”</div>' : '') +
        '<div class="actions">' +
          '<button class="ghost sm" data-act="snooze" data-id="' + esc(p.id) + '">Snooze 30m</button>' +
          '<button class="ghost sm" data-act="run" data-id="' + esc(p.id) + '">Run now</button>' +
          '<button class="ghost sm" data-act="stop" data-id="' + esc(p.id) + '">Stop</button>' +
          '<button class="bad sm" data-act="delete" data-id="' + esc(p.id) + '">Delete</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  async function load() {
    if (!token) return;
    try {
      const j = await api('/api/reminders');
      render(j.plans || []);
    } catch (e) { banner('Could not load plans: ' + e.message, false); }
  }

  async function create() {
    try {
      const body = {
        contactName: $('#contactName').value.trim(),
        phone: $('#phone').value.trim(),
        goalType: $('#goalType').value,
        goal: $('#goal').value.trim(),
        timeLocal: $('#timeLocal').value,
        timezone: $('#timezone').value.trim() || 'Asia/Karachi',
        repeatDaily: $('#repeatDaily').checked,
        maxAttempts: Number($('#maxAttempts').value) || 5,
        escalateAfterAttempts: Number($('#escalateAfterAttempts').value) || 4,
        quietHours: { start: $('#quietStart').value || '22:30', end: $('#quietEnd').value || '06:30' }
      };
      if (!body.phone) throw new Error('WhatsApp number is required');
      await api('/api/reminders', { method: 'POST', body: JSON.stringify(body) });
      banner('Reminder created.', true);
      load();
    } catch (e) { banner('Create failed: ' + e.message, false); }
  }

  async function act(id, action) {
    try {
      if (action === 'delete') await api('/api/reminders/' + encodeURIComponent(id), { method: 'DELETE' });
      else if (action === 'snooze') await api('/api/reminders/' + encodeURIComponent(id) + '/snooze', { method: 'POST', body: JSON.stringify({ minutes: 30 }) });
      else if (action === 'run') await api('/api/reminders/' + encodeURIComponent(id) + '/run-now', { method: 'POST', body: '{}' });
      else if (action === 'stop') await api('/api/reminders/' + encodeURIComponent(id) + '/stop', { method: 'POST', body: '{}' });
      banner('Done.', true);
      load();
    } catch (e) { banner('Action failed: ' + e.message, false); }
  }

  $('#token').value = token;
  $('#saveToken').addEventListener('click', () => {
    token = $('#token').value.trim();
    localStorage.setItem(tokenKey, token);
    banner('Token saved.', true);
    load();
  });
  $('#refresh').addEventListener('click', load);
  $('#create').addEventListener('click', create);
  $('#goalType').addEventListener('change', () => {
    const t = $('#goalType').value;
    if (t === 'medicine') $('#goal').value = 'Take medicine';
    if (t === 'walk') $('#goal').value = 'Morning walk';
  });
  $('#list').addEventListener('click', (ev) => {
    const b = ev.target.closest('button[data-act]');
    if (!b) return;
    act(b.dataset.id, b.dataset.act);
  });

  load();
  timer = setInterval(load, 30000);
  window.addEventListener('beforeunload', () => clearInterval(timer));
</script>
</body>
</html>
