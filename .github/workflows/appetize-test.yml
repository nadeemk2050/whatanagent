name: Build APK + Upload to Appetize (Browser Testing)

on:
  push:
    branches: ["master", "main"]
    paths:
      - "android-kotlin/**"
      - ".github/workflows/appetize-test.yml"
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    defaults:
      run:
        working-directory: android-kotlin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK location
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Write google-services.json (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Build debug APK
        run: gradle :app:assembleDebug

      # ------------------------------------------------------------------
      # Upload to Appetize.io for interactive browser-based emulator test
      # Requires: APPETIZE_API_TOKEN secret in repo settings
      # Get token free at: https://appetize.io/account
      # ------------------------------------------------------------------
      - name: Upload APK to Appetize.io
        if: ${{ env.APPETIZE_API_TOKEN != '' }}
        id: appetize
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
          APPETIZE_APP_KEY: ${{ secrets.APPETIZE_APP_KEY }}
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          # Check if a previous app key exists (update) or create new
          APP_KEY="${APPETIZE_APP_KEY}"

          if [ -z "$APP_KEY" ]; then
            echo "Creating new Appetize app..."
            RESPONSE=$(curl -s -X POST \
              "https://api.appetize.io/v1/apps" \
              -u "${APPETIZE_API_TOKEN}:" \
              -F "file=@${APK_PATH}" \
              -F "platform=android")
          else
            echo "Updating existing Appetize app ($APP_KEY)..."
            RESPONSE=$(curl -s -X POST \
              "https://api.appetize.io/v1/apps/${APP_KEY}" \
              -u "${APPETIZE_API_TOKEN}:" \
              -F "file=@${APK_PATH}" \
              -F "platform=android")
          fi

          echo "API Response: $RESPONSE"
          KEY=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('publicKey',''))")
          echo "appetize_key=$KEY" >> "$GITHUB_OUTPUT"
          echo ""
          echo "========================================"
          echo " APPETIZE INTERACTIVE TESTING LINK:"
          echo " https://appetize.io/app/${KEY}"
          echo "========================================"

      - name: Add Appetize link to job summary
        if: ${{ env.APPETIZE_API_TOKEN != '' && steps.appetize.outputs.appetize_key != '' }}
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## App Live on Appetize.io
          Test your APK directly in the browser (no install needed):

          **[Click here to open the Android Emulator in Browser](${{ format('https://appetize.io/app/{0}', steps.appetize.outputs.appetize_key) }})**

          - No download required
          - Interactive - tap/type just like a real phone
          - Works on any PC/mobile browser
          EOF

      - name: Upload APK as artifact (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: assign-task-debug-apk
          path: android-kotlin/app/build/outputs/apk/debug/app-debug.apk
