name: Firebase Test Lab - Robo Test (Auto Crash Detection)

# IMPORTANT: GitHub Actions does NOT allow the `secrets` context inside `if:` conditions.
# Doing so makes the whole workflow file invalid and every run fails instantly with
# "This run likely failed because of a workflow file issue". We therefore expose booleans
# through a job-level `env:` block (env CAN read secrets) and test those instead.
#
# Optional secrets:
#   FIREBASE_SERVICE_ACCOUNT_JSON - GCP service-account JSON with Test Lab access
#   GOOGLE_SERVICES_JSON          - google-services.json (only if the app build needs it)
# Without FIREBASE_SERVICE_ACCOUNT_JSON the Robo test is skipped and the job stays green.

on:
  push:
    branches: ["master", "main"]
    paths:
      - "android-kotlin/**"
      - ".github/workflows/firebase-test-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  robo-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      HAS_FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
      HAS_GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}

    defaults:
      run:
        working-directory: android-kotlin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK location
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Write google-services.json
        if: env.HAS_GOOGLE_SERVICES == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Build debug APK
        run: gradle :app:assembleDebug

      # ------------------------------------------------------------------
      # Firebase Test Lab - Robo Test
      # FREE: 5 virtual device tests/day on Spark plan
      # Requires: FIREBASE_SERVICE_ACCOUNT_JSON secret
      # Setup: https://firebase.google.com/docs/test-lab/android/continuous
      # ------------------------------------------------------------------
      - name: Authenticate to Google Cloud
        if: env.HAS_FIREBASE_KEY == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Set up gcloud CLI
        if: env.HAS_FIREBASE_KEY == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Robo Test on Firebase Test Lab
        if: env.HAS_FIREBASE_KEY == 'true'
        run: |
          set -o pipefail
          gcloud firebase test android run \
            --project whatanagent-a1e59 \
            --type robo \
            --app app/build/outputs/apk/debug/app-debug.apk \
            --device model=Pixel2,version=29,locale=en,orientation=portrait \
            --timeout 3m \
            --robo-directives "text:titleInput=Test Task" \
            --no-record-video \
            --format=json 2>&1 | tee firebase_test_result.txt

          cat firebase_test_result.txt

      - name: Upload Firebase test result
        if: always() && env.HAS_FIREBASE_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: firebase-test-lab-results
          path: android-kotlin/firebase_test_result.txt
          if-no-files-found: ignore

      - name: Skip message if secrets not configured
        if: env.HAS_FIREBASE_KEY != 'true'
        run: |
          echo "=========================================="
          echo " Firebase Test Lab skipped - no credentials."
          echo " Add FIREBASE_SERVICE_ACCOUNT_JSON secret"
          echo " to enable automated Robo crash testing."
          echo " The debug APK still built successfully."
          echo "=========================================="
