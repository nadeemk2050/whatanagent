name: Deploy to Tencent Lighthouse

# =============================================================================
# This replaces Render's autoDeploy: every push to master goes live on the VPS.
# Requires three repository secrets (Settings -> Secrets and variables -> Actions):
#   DEPLOY_HOST     the live server's public IP (currently 43.156.245.176)
#   DEPLOY_USER     ubuntu
#   DEPLOY_SSH_KEY  private key whose public half is in the server's authorized_keys
#
# Optional fourth secret keeps AlignTasks storage alive on a fresh server:
#   ALIGN_SERVICE_ACCOUNT_JSON  Firebase service-account key (raw JSON or base64)
#                               -> deploy/set-align-key.sh writes it with 0600 perms
# =============================================================================

on:
  push:
    branches: [master]
    # Documentation-only pushes should not restart the live service. A push that
    # also contains code still deploys normally.
    paths-ignore:
      - '**.md'
      - 'business-tank-products-template.csv'
  workflow_dispatch:        # lets you deploy manually from the Actions tab

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ] || [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "::error::DEPLOY_HOST / DEPLOY_SSH_KEY secrets are not set. Deploy skipped."
            exit 1
          fi

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              "BRANCH=${GITHUB_REF_NAME} bash /opt/whatanagent/deploy/deploy.sh"

      # The AlignTasks Admin SDK key lives outside the repo by design, so a new server
      # starts without it and every /api/align/task/* call answers 503. Write it from a
      # repository secret; if the secret is absent the existing file is left untouched.
      - name: Sync AlignTasks service-account key
        env:
          SAJSON: ${{ secrets.ALIGN_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SAJSON" ]; then
            echo "::notice::ALIGN_SERVICE_ACCOUNT_JSON is not set - leaving the server key untouched"
            exit 0
          fi
          printf '%s' "$SAJSON" | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              "bash /opt/whatanagent/deploy/set-align-key.sh"

      # Google Drive credentials for the Containers & Lots file service (/candl/api).
      # They live in repository secrets and are written into the server's .env, so no secret is
      # ever committed to the repo. This runs AFTER the deploy because the script itself arrives
      # with the checkout; it then restarts the service so the new .env is loaded.
      - name: Sync Containers & Lots Drive credentials into .env
        env:
          CID: ${{ secrets.CANDL_GDRIVE_CLIENT_ID }}
          CSECRET: ${{ secrets.CANDL_GDRIVE_CLIENT_SECRET }}
          RTOKEN: ${{ secrets.CANDL_GDRIVE_REFRESH_TOKEN }}
          PFOLDER: ${{ secrets.CANDL_GDRIVE_PARENT_FOLDER_ID }}
          SAJSON: ${{ secrets.CANDL_SERVICE_ACCOUNT_JSON }}
          IMPKEY: ${{ secrets.CANDL_IMPORT_KEY }}
        run: |
          if [ -z "$CID" ]; then echo "::warning::CANDL_GDRIVE_CLIENT_ID is not set - skipping Drive credential sync"; exit 0; fi
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              "bash /opt/whatanagent/deploy/set-candl-env.sh '$CID' '$CSECRET' '$RTOKEN' '$PFOLDER' '$SAJSON' '$IMPKEY' && sudo systemctl restart whatanagent"

      - name: Public health check
        if: success()
        continue-on-error: true
        run: |
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 "https://whatanagent.duckdns.org/healthz" || true)
            CODE=${CODE:-000}
            echo "attempt $i -> HTTP $CODE"
            if [ "$CODE" = "200" ]; then echo "HTTPS endpoint healthy"; exit 0; fi
            sleep 6
          done
          echo "::warning::HTTPS health check did not return 200 (the deploy itself already passed the local health check)"

      # Checkout repo files and deploy public/ to Firebase Hosting (whatanagent-a1e59.web.app)
      - name: Checkout repository for Firebase Hosting
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting
        if: success()
        continue-on-error: true
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          SAJSON: ${{ secrets.ALIGN_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            echo "Deploying to Firebase Hosting using FIREBASE_TOKEN..."
            npx firebase-tools deploy --only hosting --token "$FIREBASE_TOKEN" --non-interactive
          elif [ -n "$SAJSON" ]; then
            echo "Deploying to Firebase Hosting using Service Account..."
            mkdir -p /tmp/fb
            case "$SAJSON" in
              \{*) printf '%s' "$SAJSON" > /tmp/fb/sa.json ;;
              *) printf '%s' "$SAJSON" | base64 -d > /tmp/fb/sa.json ;;
            esac
            GOOGLE_APPLICATION_CREDENTIALS=/tmp/fb/sa.json npx firebase-tools deploy --only hosting --project whatanagent-a1e59 --non-interactive || {
              echo "::warning::Service account was rejected by Firebase Hosting (may need 'Firebase Hosting Admin' role). Set FIREBASE_TOKEN secret instead."
            }
            rm -rf /tmp/fb
          else
            echo "::notice::Neither FIREBASE_TOKEN nor ALIGN_SERVICE_ACCOUNT_JSON is set. Skipping Firebase Hosting deploy."
          fi
