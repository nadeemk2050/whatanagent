name: Build Android Kotlin

on:
  push:
    branches: ["master", "main"]
    paths:
      - "android-kotlin/**"
      - ".github/workflows/build-android-kotlin.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    defaults:
      run:
        working-directory: android-kotlin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK location
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Write google-services.json (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Prepare release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/keystore.jks
            printf 'storeFile=keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            echo "SIGNED=1" >> $GITHUB_ENV
            echo "release signing configured"
          else
            echo "SIGNED=0" >> $GITHUB_ENV
            echo "no keystore secret - building a debug APK"
          fi

      - name: Build APK
        run: |
          if [ "$SIGNED" = "1" ]; then
            gradle :app:assembleRelease
          else
            gradle :app:assembleDebug
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: assign-task-apk
          path: |
            android-kotlin/app/build/outputs/apk/release/app-release.apk
            android-kotlin/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Publish APK to the site
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        run: |
          set -e
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          NOTES=$(grep -oP 'releaseNotes\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1 || true)
          SRC="app/build/outputs/apk/release/app-release.apk"
          [ -f "$SRC" ] || SRC="app/build/outputs/apk/debug/app-debug.apk"
          [ -f "$SRC" ] || { echo "no APK produced"; exit 1; }
          cp "$SRC" "../public/downloads/aligntasks-$VERSION.apk"
          cat > ../public/downloads/version.json <<EOF
          {
            "versionCode": $CODE,
            "versionName": "$VERSION",
            "apkUrl": "https://whatanagent-a1e59.web.app/downloads/aligntasks-$VERSION.apk",
            "notes": "${NOTES:-AlignTasks for Android $VERSION}",
            "mandatory": false,
            "publishedAt": "$(date -u +%F)"
          }
          EOF
          ls -lh "../public/downloads/"
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/downloads
          git diff --staged --quiet || git commit -m "chore(android): publish APK $VERSION ($CODE)"
          git push

      # A push made with GITHUB_TOKEN does not trigger other workflows, so ask the site
      # deploy to run explicitly — otherwise duckdns keeps serving the previous APK.
      - name: Deploy the site with the new APK
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"master"}' || true